---
- name: Patroni | Install Patroni
  vars:
    ansible_python_interpreter: /usr/bin/python3
    _pip_extra_args: >-
      --trusted-host=pypi.python.org
      --trusted-host=pypi.org
      --trusted-host=files.pythonhosted.org
      {{ '--break-system-packages' if ansible_facts['distribution_release'] == 'trixie' else '' }}
  tags: patroni
  block:
    - name: Patroni | Copy patroni requirements.txt file
      ansible.builtin.template:
        src: requirements.txt.j2
        dest: /tmp/requirements.txt
        mode: '0644'

    - name: Patroni | Install setuptools
      ansible.builtin.pip:
        name: "{{ 'setuptools>=67.0.0' if ansible_facts['distribution_release'] == 'trixie' else 'setuptools<66.0.0' }}"
        state: present
        executable: pip3
        extra_args: "{{ _pip_extra_args }}"
        umask: "0022"
      environment:
        PATH: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin:/usr/bin"

    - name: Patroni | Install requirements
      ansible.builtin.pip:
        requirements: /tmp/requirements.txt
        executable: pip3
        extra_args: "{{ _pip_extra_args }}"
        umask: "0022"
      environment:
        PATH: "{{ ansible_facts['env']['PATH'] }}:{{ postgresql_bin_dir }}:/usr/local/bin:/usr/bin"

    - name: "Patroni | Install patroni {{ patroni_install_version }}"
      ansible.builtin.pip:
        name: "patroni=={{ patroni_install_version }}"
        executable: pip3
        extra_args: "{{ _pip_extra_args }}"
        umask: "0022"
      environment:
        PATH: "{{ ansible_facts['env']['PATH'] }}:/usr/local/bin:/usr/bin"
      when: patroni_install_version != "latest"

- name: Patroni | Create conf directory
  ansible.builtin.file:
    path: "{{ patroni_conf_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  tags: patroni

- name: Patroni | Gather facts from existing nodes to get their IPs
  ansible.builtin.setup:
    gather_subset: ['network']
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['patroni'] | reject('equalto', inventory_hostname) | list }}"
  when: patroni_new_node | bool
  tags: patroni

- name: Patroni | Generate conf file "{{ patroni_conf_dir }}/patroni.yml"
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ patroni_conf_dir }}/patroni.yml"
    owner: postgres
    group: postgres
    mode: '0640'
  when: existing_pgcluster is not defined or not existing_pgcluster | bool
  tags: patroni

- name: Patroni | Create patroni log directory
  ansible.builtin.file:
    path: "{{ patroni_log_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: '0750'
  when: patroni_log_destination == 'logfile'
  tags: patroni

- name: Patroni | Copy systemd service file "/etc/systemd/system/patroni.service"
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: postgres
    group: postgres
    mode: '0644'
  tags: patroni

- name: Patroni | Update etcd hosts on existing nodes when adding a new node
  when: patroni_new_node | bool
  tags: patroni
  block:
    - name: Patroni | Propagate updated patroni.yml to existing nodes
      ansible.builtin.template:
        src: patroni.yml.j2
        dest: "{{ patroni_conf_dir }}/patroni.yml"
        owner: postgres
        group: postgres
        mode: '0640'
      delegate_to: "{{ item }}"
      vars:
        ansible_facts: "{{ hostvars[item]['ansible_facts'] }}"
      loop: "{{ groups['patroni'] | reject('equalto', inventory_hostname) | list }}"
      register: patroni_etcd_updated

    - name: Patroni | Reload Patroni on existing nodes where etcd hosts changed
      ansible.builtin.systemd:
        name: patroni
        state: reloaded
      delegate_to: "{{ item.item }}"
      loop: "{{ patroni_etcd_updated.results }}"
      when: item.changed
