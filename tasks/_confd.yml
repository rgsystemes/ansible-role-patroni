---
- name: Confd | Download and copy "confd" binary file to /usr/local/bin/
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: /usr/local/bin/confd
    mode: '0755'
    timeout: 60
    validate_certs: false
  loop:
    - "{{ confd_package_repo }}"
  when: confd_package_repo | length > 0
  tags: confd

- name: Confd | Create conf directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/confd/conf.d
    - /etc/confd/templates
  tags: confd

- name: Confd | Generate configuration files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  notify: restart confd
  loop:
    - src: confd.toml.j2
      dest: /etc/confd/confd.toml
    - src: haproxy.toml.j2
      dest: /etc/confd/conf.d/haproxy.toml
    - src: haproxy.tmpl.j2
      dest: /etc/confd/templates/haproxy.tmpl
  tags: confd

- name: Confd | Copy systemd service file
  ansible.builtin.copy:
    src: confd.service
    dest: /etc/systemd/system/confd.service
    owner: root
    group: root
    mode: '0644'
  notify: restart confd
  tags: confd

- name: Confd | Flush handlers to restart confd service
  ansible.builtin.meta: flush_handlers

- name: Confd | Propagate updated confd.toml to existing nodes when adding a new node
  when: patroni_new_node | bool
  tags: confd
  block:
    - name: Confd | Update confd.toml on existing cluster nodes
      ansible.builtin.template:
        src: confd.toml.j2
        dest: /etc/confd/confd.toml
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ item }}"
      loop: "{{ groups['patroni'] | reject('equalto', inventory_hostname) | list }}"
      register: confd_propagate

    - name: Confd | Restart service on nodes where configuration changed
      ansible.builtin.systemd:
        name: confd
        state: restarted
      delegate_to: "{{ item.item }}"
      loop: "{{ confd_propagate.results }}"
      when: item.changed
