---
- name: Etcd | Install etcd packages
  ansible.builtin.apt:
    name: "{{ etcd_packages }}"
    state: present
  register: etcd_status
  until: etcd_status is success
  delay: 5
  retries: 3
  tags: etcd

- name: Etcd | Create etcd configuration directory
  ansible.builtin.file:
    path: "{{ etcd_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  tags: etcd

- name: Etcd | Gather facts from existing nodes to get their IPs
  ansible.builtin.setup:
    gather_subset: ['network']
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['patroni'] | reject('equalto', inventory_hostname) | list }}"
  when: patroni_new_node | bool
  tags: etcd

- name: Etcd | Generate conf files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - src: etcd.conf.j2
      dest: /etc/etcd/etcd.conf
    - src: etcd.service.j2
      dest: /etc/systemd/system/etcd.service
  register: etcd_config_result
  tags: etcd

- name: Etcd | Stop etcd service
  ansible.builtin.systemd:
    name: etcd
    state: stopped
  when: etcd_config_result is changed
  tags: etcd

- name: Etcd | Add a node to etcd cluster
  when: patroni_new_node | bool
  tags: etcd
  block:
    - name: Etcd | Remove data directory
      ansible.builtin.file:
        path: "{{ etcd_data_dir }}/member"
        state: absent

    - name: Etcd | Add a member to etcd cluster
      ansible.builtin.shell: |
        etcdctl member add {{ ansible_facts['hostname'] }} --peer-urls=http://{{ ansible_default_ipv4.address }}:2380
      delegate_to: "{{ groups['patroni'][0] }}"

    - name: Etcd | Propagate updated etcd.conf to existing nodes
      ansible.builtin.template:
        src: etcd.conf.j2
        dest: /etc/etcd/etcd.conf
        owner: root
        group: root
        mode: '0644'
      delegate_to: "{{ item }}"
      loop: "{{ groups['patroni'] | reject('equalto', inventory_hostname) | list }}"

- name: Etcd | Enable and start etcd service
  ansible.builtin.systemd:
    daemon_reload: true
    name: etcd
    enabled: true
    state: started
  tags: etcd

- name: Etcd | Wait for port 2379 to become open on the host
  ansible.builtin.wait_for:
    port: 2379
    host: 127.0.0.1
    state: started
    timeout: 60
    delay: 10
  ignore_errors: false
  tags: etcd

- name: Etcd | Check etcd cluster health
  tags: etcd
  block:
    - name: Etcd | Wait until the etcd cluster is healthy
      ansible.builtin.shell: |
        ETCDCTL_API=3 /usr/bin/etcdctl endpoint health --endpoints=http://{{ inventory_hostname }}:2379
      register: etcd_health_result
      until: "'is healthy' in etcd_health_result.stderr or 'is healthy' in etcd_health_result.stdout"
      retries: 5
      delay: 10
      changed_when: false
      ignore_errors: false

    - name: Etcd | Display cluster health
      ansible.builtin.debug:
        msg: "{{ etcd_health_result.stderr }} {{ etcd_health_result.stdout }}"

    - name: Etcd | Display member list
      ansible.builtin.shell: |
        etcdctl member list
      delegate_to: "{{ groups.patroni[0] }}"
      changed_when: false
